name: Instagram 지표 갱신 & 배포

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instagram 지표 가져오기
        id: sync
        if: github.event_name != 'push'
        continue-on-error: true # 실패해도 직접 입력값으로 배포
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_REFRESH_TOKEN_OUT: ${{ secrets.GH_PAT != '' && format('{0}/new_token', runner.temp) || '' }}
        run: node scripts/sync-instagram.mjs

      - name: 갱신된 토큰을 Secret에 저장
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ ! -s "$RUNNER_TEMP/new_token" ]; then echo "토큰 갱신 건너뜀"; exit 0; fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
          rm -f "$RUNNER_TEMP/new_token"

      - name: 지표 파일 커밋
        if: github.event_name != 'push' && steps.sync.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "chore: Instagram 지표 자동 갱신"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
